[project]
name = "sjpoll"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ryan Sheppard", email = "ryandsheppard95@gmail.com" }]
requires-python = ">=3.14.7"
dependencies = [
    "django>=6.1.1",
    "django-allauth[socialaccount]>=65.0",
    "django-cf>=0.2.16",
    "django-ninja>=1.7.1",
    "whitenoise>=6.0",
]

[project.scripts]
sjpoll = "sjpoll:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "workers-py>=1.17.4",
]

[tool.ruff]
extend-exclude = ["polls/migrations"]

[tool.ty.src]
exclude = ["polls/migrations"]
