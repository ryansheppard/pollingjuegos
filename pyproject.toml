[project]
name = "pollingjuegos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ryan Sheppard", email = "ryandsheppard95@gmail.com" }]
requires-python = ">=3.14.7"

[dependency-groups]
main = [
  "django>=6.1.1",
  "django-allauth[socialaccount]>=65.0",
  "django-ninja>=1.7.1",
  "gunicorn>=23,<24",
  "nflreadpy>=0.1.5",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-distro>=0.66b2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-django>=0.66b2",
  "opentelemetry-instrumentation-logging>=0.66b2",
  "opentelemetry-instrumentation-requests>=0.66b2",
  "opentelemetry-sdk[file-configuration]>=1.45.2",
  "whitenoise>=6.0",
]
dev = ["ruff>=0.16.9", "ty>=0.0.84", { include-group = "main" }]

[tool.ruff]
extend-exclude = ["backend/polls/migrations"]

[tool.ty.src]
exclude = ["backend/polls/migrations"]
