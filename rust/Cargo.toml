[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
jiff = { version = "0.2.38", features = ["serde"] }
ntex = { version = "4.5.0", features = ["neon-uring", "cookie", "rustls"] }
rand = "0.10.3"
refinery = { version = "0.10.0", features = ["rusqlite"] }
rusqlite = { version = "0.41.0", features = ["bundled", "jiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
