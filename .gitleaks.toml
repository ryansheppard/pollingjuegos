title = "pollingjuegos"

[extend]
useDefault = true

# gitleaks dir scans ignored files too; local mise settings contain real credentials.
[[allowlists]]
description = "Ignore local, untracked mise credentials"
paths = ['''^mise\.local\.toml$''']

[[allowlists]]
description = "Ignore local, untracked Terraform state (holds the origin TLS key)"
paths = ['''^terraform/terraform\.tfstate(\.backup)?$''']
