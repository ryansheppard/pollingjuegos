name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Tags release the desktop app only; publish/deploy stay gated on main.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    concurrency:
      # Main runs test on the template MicroVM and checkpoint it, so they take turns there.
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'runner-checkpoint' || format('test-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: hk check --all
      - name: Test on the runner MicroVM
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          # PRs test their head commit; the VM can't fetch GitHub's synthetic merge commit.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          VM_RUN_FLAGS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--checkpoint' || '' }}
        # Unquoted so an empty value adds no argument.
        run: runner/vm-run.sh $VM_RUN_FLAGS pollingjuegos-runner "$COMMIT" -- bazel test //... --test_output=errors
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645  # v7.0.0
        if: ${{ failure() }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "Lint or tests failed on ${{ github.ref_name }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    concurrency:
      # Keeps image tags landing in commit order ahead of deploy.
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build and push both images on the runner MicroVM
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          release="${GITHUB_SHA::12}"
          # One call so both pushes share a job MicroVM and its Bazel server.
          runner/vm-run.sh --registry-push pollingjuegos-runner "$GITHUB_SHA" -- \
            bash -c 'bazel run //backend:push -- -tag "$1" && bazel run //frontend:push -- -tag "$1"' _ "$release"
          echo "Published $release" >> "$GITHUB_STEP_SUMMARY"
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645  # v7.0.0
        if: ${{ failure() }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "Building or pushing containers failed"

  deploy:
    name: Deploy droplet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deploy
      - name: Run deployment over Tailscale
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          release="${GITHUB_SHA::12}"
          # tailscale ssh verifies the host key from the tailnet netmap, so no known_hosts secret is needed
          tailscale ssh "deploy@$DEPLOY_HOST" \
            "sudo -n /usr/local/bin/pollingjuegos-deploy $release"
          echo "Deployed $release" >> "$GITHUB_STEP_SUMMARY"
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645  # v7.0.0
        if: ${{ failure() }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "Deploying to the droplet failed"
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645  # v7.0.0
        if: ${{ success() }}
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "Deployed to the droplet successfully"

  release:
    name: Release desktop app
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build and release on the runner MicroVM
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          # Scoped to this repo and expires with the job, which outlives the upload.
          VM_GITHUB_TOKEN: ${{ github.token }}
        run: runner/vm-run.sh pollingjuegos-runner "$GITHUB_SHA" -- runner/release-desktop.sh "$GITHUB_REF_NAME"
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645  # v7.0.0
        if: ${{ failure() }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "Desktop release ${{ github.ref_name }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
