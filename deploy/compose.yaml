# Copy this file to /opt/pollingjuegos/compose.yaml, and seccomp-io-uring.json
# alongside it. Set RELEASE to a pushed
# image tag before running Compose; never use `latest` for a production release.
services:
  backend:
    image: >-
      registry.digitalocean.com/pollingjuegos/backend:backend-${RELEASE:?required}
    env_file: /etc/pollingjuegos.env
    environment:
      DB_PATH: /data/db.sqlite3
      PUBLIC_ORIGIN: https://pj.ryansheppard.xyz
    volumes:
      - /var/lib/pollingjuegos/data:/data
    cap_drop: [ALL]
    security_opt:
      - 'no-new-privileges:true'
      # Docker's default profile plus io_uring, which ntex's neon-uring runtime needs.
      - 'seccomp=/opt/pollingjuegos/seccomp-io-uring.json'
    restart: unless-stopped
    # No public port: frontend reaches the backend on the private Compose network.

  frontend:
    image: >-
      registry.digitalocean.com/pollingjuegos/backend:frontend-${RELEASE:?required}
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      # Origin CA cert/key and AOP client cert from `terraform output`; key mode 0600.
      - /etc/pollingjuegos/tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
