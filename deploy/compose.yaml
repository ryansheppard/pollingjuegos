# Copy this file to /opt/pollingjuegos/compose.yaml. Set RELEASE to a pushed
# image tag before running Compose; never use `latest` for a production release.
services:
  backend:
    image: >-
      registry.digitalocean.com/pollingjuegos/backend:backend-${RELEASE:?required}
    env_file: /etc/pollingjuegos.env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      NFLREADPY_CACHE: filesystem
      NFLREADPY_CACHE_DIR: /data/nflreadpy
    volumes:
      - /var/lib/pollingjuegos/data:/data
    restart: unless-stopped
    # No public port: frontend reaches Gunicorn on the private Compose network.

  frontend:
    image: >-
      registry.digitalocean.com/pollingjuegos/backend:frontend-${RELEASE:?required}
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      # Origin CA cert/key from `terraform output`; root-owned, key mode 0600.
      - /etc/pollingjuegos/tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
